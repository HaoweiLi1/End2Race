# End2Race PPO Internal Configuration

# Multiprocessing
start_method: forkserver

# Environment Timing
simulator_timestep: 0.01
episode_horizon: 8.0

# PPO Internals
warmup_max_epochs: 30
warmup_patience: 3
warmup_train_fraction: 0.8
value_loss_coefficient: 0.5
max_grad_norm: 0.5

# Actor Exploration
exploration_gate_info_key: exploration_danger_gate
steering_bound: 0.52

# Privileged Critic Features
delta_s_scale_m: 10.0
relative_lateral_scale_m: 2.0
longitudinal_velocity_scale_mps: 10.0
lateral_velocity_scale_mps: 5.0
ego_speed_scale_mps: 10.0
yaw_rate_scale_radps: 5.0
slip_angle_scale_rad: 0.5
curvature_scale_percentile: 95.0
curvature_lookahead_m: 1.0
curvature_lookahead_samples: 16
dynamic_model_speed_threshold_mps: 0.5
clearance_normalization_version: p20_clearance_softsign_v2
clearance_normalization_formula: min(distance_m / (distance_m + half_response_m), nextafter(1, 0))
obb_longitudinal_clearance_half_response_m: 0.6
obb_lateral_clearance_half_response_m: 0.2
wall_clearance_half_response_m: 0.2

# Potential-based shaping over anisotropic vehicle OBB and map-wall surface clearance.
progress_weight: 0.01
relative_weight: 0.02
collision_penalty: -2.0
risk_longitudinal_clearance_m: 0.6
risk_lateral_clearance_m: 0.2
risk_wall_clearance_m: 0.2
risk_potential_maximum: 0.05

# Racelines
ego_raceline: raceline1
opponent_racelines: [raceline0, raceline1, raceline2]

# Ordinary Scenario Generation
ordinary_startpoint_count: 50
ordinary_interval_index: 15
ordinary_speed_scales: [0.5, 0.6, 0.7, 0.8]

# Collision Scenario Generation
collision_startpoint_count: 100
collision_interval_indices: [8, 10, 12, 15]
collision_speed_scales: [0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85]

# Front-corridor temporal exploration gate. The 1.0 m arm lost the same-line
# benefit; 2.0 m is the retained setting. This does not affect baseline mode.
front_corridor_gate_maximum_gap_m: 2.0
front_corridor_gate_maximum_abs_opponent_lateral_d_m: 0.25
front_corridor_gate_require_positive_lateral_overlap: true
