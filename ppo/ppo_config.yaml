# End2Race PPO Internal Configuration

# Multiprocessing
start_method: forkserver

# Environment Timing
simulator_timestep: 0.01
episode_horizon: 8.0

# Racelines
ego_raceline: raceline1
opponent_racelines: [raceline0, raceline1, raceline2]

# Privileged Critic Feature Normalization (frozen before experiments)
# privileged_curvature_scale: 95th percentile of |kappa_radpm| over Austin raceline1.csv
# privileged_track_margin_scale: Austin nominal half track width in meters
privileged_curvature_scale: 0.378086
privileged_track_margin_scale: 1.1

# Ordinary Scenario Generation
ordinary_startpoint_count: 50
ordinary_interval_index: 15
ordinary_speed_scales: [0.5, 0.6, 0.7, 0.8]
ordinary_startpoint_min_distance: 1.0

# Collision Scenario Generation
collision_startpoint_count: 100
collision_interval_indices: [8, 10, 12, 15]
collision_speed_scales: [0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85]
collision_startpoint_min_distance: 1.0
